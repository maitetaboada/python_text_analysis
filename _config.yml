# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Python for text analysis
author: <a href="https://www.sfu.ca/~mtaboada"></a> Maite Taboada
copyright: "2025"
logo: ./img/logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: "off"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

launch_buttons:
  notebook_interface        : classic  # The interface interactive links will activate ["classic", "jupyterlab"]
  binderhub_url             : "https://mybinder.org"  # The URL of the BinderHub (e.g., https://mybinder.org)
#  jupyterhub_url            : ""  # The URL of the JupyterHub (e.g., https://datahub.berkeley.edu)
#  thebe                     : false  # Add a thebe button to pages (requires the repository to run on Binder)
#  colab_url                 : "" # The URL of Google Colab (https://colab.research.google.com)
#  deepnote_url              : "" # The URL of Deepnote (https://deepnote.com)


# Information about where the book exists on the web
repository:
  url: https://github.com/maitetaboada/python_text_analysis  # Online location of your book
#  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  extra_footer              : |
    <div>
    <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/"><img class="license" alt="Creative Commons License" src="https://i.creativecommons.org/l/by-nc-sa/4.0/80x15.png" /></a> This book is licensed under a <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">Creative Commons BY-NC-SA 4.0 License</a>.  
    </div>

sphinx:
  config:
    html_static_path: ["_static"]
